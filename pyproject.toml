[project]
name = "clipponyai"
version = "0.1.0"
description = "A cute desktop pony assistant that keeps track of your tasks, reminds you to do stuff, and can peek at your screen — powered by any LLM provider you like."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ignacy Daszkiewicz" }]
keywords = ["assistant", "desktop-pet", "pony", "llm", "reminders", "tasks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "open-agent-compiler>=1.16",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "PySide6>=6.6",
    "qasync>=0.27",
    "mss>=9.0",
    "markdown>=3.10.2",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
clipponyai = "clipponyai.cli:main"

[project.urls]
Homepage = "https://github.com/DehydratedWater/clipponyai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipponyai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    'live: tests that hit a real LLM endpoint (deselect with -m "not live")',
]

[tool.ruff]
line-length = 100
target-version = "py312"
